<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Table</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  table {
    border-collapse: collapse;
  }
  th, td {
    border: 1px solid #333;
    padding: 10px 20px;
    text-align: left;
    font-size: 15px;
  }
  thead th {
    font-weight: bold;
    text-align: center;
  }
  tbody td:first-child {
    text-align: center;
  }
</style>
</head>
<body>

<table>
  <thead>
    <tr>
      <th>No.</th>
      <th>Full Name</th>
      <th>Position</th>
      <th>Salary</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>1</td>
      <td>Bill Gates</td>
      <td>Founder Microsoft</td>
      <td>$1000</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Steve Jobs</td>
      <td>Founder Apple</td>
      <td>$1200</td>
    </tr>
    <tr>
    <td>3</td>
      <td>Larry Page</td>
      <td>Founder Google</td>
      <td>$1100</td>
    </tr>
    <tr>
      <td>4</td>
      <td>Mark Zuckerberg</td>
      <td>Founder Facebook</td>
      <td>$1300</td>
    </tr>
  </tbody>
</table>

</body>
</html>
